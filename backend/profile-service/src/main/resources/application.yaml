spring:
  application:
    name: ProfileService

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SUPABASE_URL}

    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASS}
    driverClassName: org.postgresql.Driver

    hikari:
      data-source-properties:
        ssl: true
        sslmode: require

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true


server:
  port: 8091